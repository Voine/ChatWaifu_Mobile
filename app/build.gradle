static def getDate(){
    def date = new Date()
    def formattedDate = date.format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
    return formattedDate
}

android {
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "ChatWaifu"+"_"+getDate()+".apk"
                }
            }
            buildConfigField "String","CHAT_CHPT_KEY","\"\""
            buildConfigField "String","TRANSLATE_APP_ID","\"\""
            buildConfigField "String","TRANSLATE_KEY","\"\""
        }
        debug{
            buildConfigField "String","CHAT_CHPT_KEY","${readLocalProperties("CHAT_CPT_KEY")}"
            buildConfigField "String","TRANSLATE_APP_ID","${readLocalProperties("TRANSLATE_APP_ID")}"
            buildConfigField "String","TRANSLATE_KEY","${readLocalProperties("TRANSLATE_KEY")}"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get())
        targetCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get())
    }
    kotlinOptions {
        jvmTarget = libs.versions.jvmTarget.get()
    }

    buildFeatures {
        viewBinding true
        compose true
        // AGP 8+ 起 buildConfig 默认关闭，下面 buildConfigField 依赖它
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace 'com.chatwaifu.mobile'

    lint {
        // compose-bom 2023.04.01 带的 compose lint 检测器和 AGP 9 的 lint API 不兼容，
        // 这个检测器会直接让 lintAnalyzeDebug 崩掉（KotlinUastResolveProviderService is null），
        // 导致整个 lint 任务不可用。升级 compose-bom 后应该删掉这一行。
        disable 'MutableCollectionMutableState'
    }
}

