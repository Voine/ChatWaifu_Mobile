static def getDate(){
    def date = new Date()
    def formattedDate = date.format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
    return formattedDate
}

android {
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        vectorDrawables {
            useSupportLibrary = true
        }
        ndk {
            // **决定 APK 里最终有哪些 ABI 的就是这一处**。库模块里的 abiFilters 只约束
            // 自己 CMake 的产物，管不到别人预置的 jniLibs（Sherpa 就是预置 .so），
            // 也管不到 AAR 带进来的 .so —— 加这条之前包里躺着 4 个 ABI。
            //
            // 只出 arm64-v8a 是被 Bert-VITS2-MNN 逼的：它的 libMNN / libbertvits2 /
            // libtokenizers_c.a 只有 arm64 一份。不过滤的话 32 位设备装得上、
            // 但一调 TTS 就 UnsatisfiedLinkError，比装不上更糟。
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String","CHAT_CHPT_KEY","\"\""
            buildConfigField "String","TRANSLATE_APP_ID","\"\""
            buildConfigField "String","TRANSLATE_KEY","\"\""
        }
        debug{
            buildConfigField "String","CHAT_CHPT_KEY","${readLocalProperties("CHAT_CPT_KEY")}"
            buildConfigField "String","TRANSLATE_APP_ID","${readLocalProperties("TRANSLATE_APP_ID")}"
            buildConfigField "String","TRANSLATE_KEY","${readLocalProperties("TRANSLATE_KEY")}"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get())
        targetCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get())
    }

    buildFeatures {
        viewBinding = true
        compose = true
        // AGP 8+ 起 buildConfig 默认关闭，下面 buildConfigField 依赖它
        buildConfig = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    namespace = 'com.chatwaifu.mobile'
}

// release 包重命名成 ChatWaifu_<yyyyMMddHHmm>.apk。
// 原先用的是 `android.applicationVariants.all {}`（旧 variant API，AGP 10 移除，
// 且和 android.newDsl=true 不兼容），换成 androidComponents.onVariants。
// 顺带修了个老 bug：那段代码虽然写在 buildTypes.release {} 里，但 applicationVariants
// 是全局的，实际对 debug 也生效，debug 包也被改名。现在用 selector 真正只作用于 release。
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            // 新 variant API 里 outputFileName 是 Property<String>，只能 set 不能直接赋值
            output.outputFileName.set("ChatWaifu_${getDate()}.apk")
        }
    }
}

