pluginManagement {
    repositories {
        // 阿里云镜像放在最前面，国内解析明显快；后面三个官方源做兜底
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}
plugins {
    // 这个版本号没法走 version catalog：settings 插件的解析早于 catalog 可用
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Bert-VITS2-MNN 的 AAR 本地仓库。**不入库**，由 submodule 现场产出：
        //   cd Bert-VITS2-MNN && ./gradlew publishAars \
        //       -PpublishGroupId=com.chatwaifu.bv2 -PpublishVersion=<版本>
        // 放在最前面，省得每次都去镜像站问一遍这个不存在的坐标。
        maven { url = uri("$rootDir/Bert-VITS2-MNN/build/repo") }
        maven { url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }
}
rootProject.name = "ChatWaifu_Mobile"
include ':app'
include ':VITS'
include ':ChatCore'
include ':Live2D'
include ':Translate'
include ':Log'
include ':Lipsync'
include ':Sherpa'
